[build]
  # Clear npm cache and install dependencies with flags, then build
  # This ensures a clean install with --legacy-peer-deps
  command = "npm cache clean --force || true && npm install --legacy-peer-deps --no-audit && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  NPM_FLAGS = "--legacy-peer-deps --no-audit"
  # Ensure npm uses the correct registry
  NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"


[build]
# Since .npmrc has legacy-peer-deps=true, we don't need the flag here
# This simpler command should be more reliable
command = "npm install --no-audit && npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
NPM_FLAGS = "--no-audit"
NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"

# Temporarily commented out due to DNS resolution error (EAI_AGAIN)
# Uncomment after Netlify resolves the network issue
# [[plugins]]
# package = "@netlify/plugin-nextjs"

[functions]
node_bundler = "esbuild"

# Headers for Open Graph image route - ensure proper caching and accessibility
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/png"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "index, follow"

